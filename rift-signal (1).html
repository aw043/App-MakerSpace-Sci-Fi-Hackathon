  ctx.fillStyle = col;
  ctx.fillText(PHASE_NAME[act], px0 + 44, py0 + 17);
  font(10, 600);
  ctx.fillStyle = C.muted;
  ctx.fillText('GRAVITY', px0 + 44, py0 + 32);
  const ax = px0 + 112, ay = py0 + 32;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  if (act === OVER) {
    ctx.moveTo(ax, ay - 7); ctx.lineTo(ax, ay + 7);
    ctx.moveTo(ax - 5, ay + 2); ctx.lineTo(ax, ay + 7); ctx.lineTo(ax + 5, ay + 2);
  } else {
    ctx.moveTo(ax, ay + 7); ctx.lineTo(ax, ay - 7);
    ctx.moveTo(ax - 5, ay - 2); ctx.lineTo(ax, ay - 7); ctx.lineTo(ax + 5, ay - 2);
  }
  ctx.stroke();
  const rx = px0 + 206, ry = py0 + 23, rr = 16;
  const ready = game.shiftCooldown <= 0;
  ctx.strokeStyle = 'rgba(139,155,181,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rx, ry, rr, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = ready ? PHASE_COLOR[act === OVER ? UNDER : OVER] : 'rgba(139,155,181,.8)';
  ctx.beginPath();
  ctx.arc(rx, ry, rr, -Math.PI / 2, -Math.PI / 2 + (ready ? 1 : 1 - game.shiftCooldown / PL.shiftCooldown) * 6.2832);
  ctx.stroke();
  font(9, 700);
  ctx.textAlign = 'center';
  ctx.fillStyle = ready ? C.text : C.muted;
  ctx.fillText('SHIFT', rx, ry);
  if (ready && game.room === 0 && !teach.shifted) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(game.frameTime * 6);
    ctx.strokeStyle = PHASE_COLOR[act === OVER ? UNDER : OVER]; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rx, ry, rr + 6, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  /* Radio strip */
  if (game.captionTimer > 0 && game.captionText) {
    const alpha = Math.min(1, game.captionTimer / 0.6);
    let size = 16;
    font(size, 600);
    while (ctx.measureText(game.captionText).width > 580 && size > 11) { size--; font(size, 600); }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(7,10,20,.86)';
    roundRect(330, 648, 620, 42, 8); ctx.fill();
    ctx.strokeStyle = rgba(PHASE_RGB[act], 0.42); ctx.lineWidth = 1.2;
    roundRect(330, 648, 620, 42, 8); ctx.stroke();
    ctx.fillStyle = C.text;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(game.captionText, 640, 669);
    ctx.restore();
  }

  ctx.textAlign = 'right';
  font(10, 700);
  ctx.fillStyle = game.muted ? C.danger : 'rgba(139,155,181,.6)';
  ctx.fillText(game.muted ? 'MUTED [M]' : 'AUDIO [M]', W - 40, 656);
  ctx.fillStyle = 'rgba(139,155,181,.6)';
  ctx.fillText('PAUSE [P]', W - 40, 674);

  const strip = coarsePointer
    ? '◀ ▶ MOVE  ·  JUMP  ·  FIRE  ·  PHASE  ·  USE'
    : 'A/D MOVE  ·  SPACE JUMP  ·  CLICK FIRE  ·  SHIFT/E PHASE  ·  F USE';
  font(12, 600);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(139,155,181,.85)';
  ctx.fillText(strip, W / 2, H - 16);
}

function renderEffects() {
  /* A wash in the active phase's colour ties the whole frame to the phase you
     are standing in — the cheapest possible "which side am I on" signal. */
  const ph = game.activePhase;
  const wash = washGrad[ph] || (washGrad[ph] = (() => {
    const g = ctx.createRadialGradient(W / 2, 360, 80, W / 2, 360, 780);
    g.addColorStop(0, rgba(PHASE_RGB[ph], 0.045));
    g.addColorStop(1, rgba(PHASE_RGB[ph], 0));
    return g;
  })());
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  if (!cornerGrad) {
    cornerGrad = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 820);
    cornerGrad.addColorStop(0, 'rgba(4,6,13,0)');
    cornerGrad.addColorStop(1, 'rgba(4,6,13,0.55)');
  }
  ctx.fillStyle = cornerGrad;
  ctx.fillRect(0, 0, W, H);

  const sp = scanlines();
  if (sp && !reduceMotion) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = sp;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (game.vignette > 0) {
    if (!hurtGrad) {
      hurtGrad = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 760);
      hurtGrad.addColorStop(0, 'rgba(255,105,94,0)');
      hurtGrad.addColorStop(1, 'rgba(255,105,94,1)');
    }
    ctx.save();
    ctx.globalAlpha = 0.42 * game.vignette;
    ctx.fillStyle = hurtGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (game.flash > 0) {
    ctx.fillStyle = rgba(game.flashColor, 0.26 * game.flash);
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- Overlays ---------- */
const BTN = {
  resume:   { x: W / 2 - 232, y: 416, w: 216, h: 58, label: 'RESUME' },
  pauseEnd: { x: W / 2 + 16,  y: 416, w: 216, h: 58, label: 'RESTART MISSION' },
  retry:    { x: W / 2 - 130, y: 404, w: 260, h: 62, label: 'RETRY ROOM' },
  restart:  { x: W / 2 - 110, y: 486, w: 220, h: 42, label: 'RESTART MISSION' },
  again:    { x: W / 2 - 140, y: 470, w: 280, h: 60, label: 'PLAY AGAIN' }
};
function inBtn(b, p) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function overlayClick(p) {
  if (game.state === STATE.PAUSED) {
    if (inBtn(BTN.resume, p)) setState(STATE.PLAYING);
    else if (inBtn(BTN.pauseEnd, p)) startRun();
  } else if (game.state === STATE.DEFEAT && game.endTimer > 0.5) {
    if (inBtn(BTN.retry, p)) retryRoom();
    else if (inBtn(BTN.restart, p)) startRun();
    else retryRoom();
  } else if (game.state === STATE.VICTORY && game.endTimer > 3) {
    startRun();
  }
}
function drawButton(b, accent, small) {
  const hot = inBtn(b, pointer);
  ctx.fillStyle = hot ? rgba(PHASE_RGB[0], 0.16) : 'rgba(17,26,43,.92)';
  roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  ctx.strokeStyle = accent; ctx.lineWidth = hot ? 2.4 : 1.6;
  roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
  font(small ? 13 : 17, 700);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.text;
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
}
function dim(a) { ctx.fillStyle = 'rgba(4,6,13,' + a + ')'; ctx.fillRect(0, 0, W, H); }

function renderVictoryWorld() {
  const k = Math.min(1, game.endTimer / 3);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(234,242,255,' + (0.6 * (1 - k)).toFixed(3) + ')';
  ctx.lineWidth = 2 + 8 * (1 - k);
  ctx.beginPath();
  ctx.moveTo(W / 2, 200 + 150 * k); ctx.lineTo(W / 2, 520 - 150 * k);
  ctx.stroke();
  ctx.restore();
  const sx = 1130 - k * k * 900, sy = 340 - k * 120;
  ctx.save();
  ctx.globalAlpha = Math.min(1, k * 2.4);
  ctx.translate(sx, sy);
  ctx.scale(-1, 1);
  ctx.fillStyle = '#0C1424'; ctx.strokeStyle = C.over; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(30, 0); ctx.lineTo(6, -13); ctx.lineTo(-28, -11);
  ctx.lineTo(-28, 11); ctx.lineTo(6, 13);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.over;
  ctx.fillRect(-12, -3, 9, 6);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(73,244,255,.5)';
  ctx.beginPath();
  ctx.moveTo(-28, -5); ctx.lineTo(-60 - 50 * k, 0); ctx.lineTo(-28, 5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function renderOverlay() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (game.state === STATE.TITLE) {
    dim(0.58);
    const p = 0.5 + 0.5 * Math.sin(game.frameTime * 2.2);
    font(84, 800);
    const wA = ctx.measureText('RIFT').width, wB = ctx.measureText('SIGNAL').width, gap = 30;
    const tx = W / 2 - (wA + gap + wB) / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = C.over; ctx.fillText('RIFT', tx, 296);
    ctx.fillStyle = C.under; ctx.fillText('SIGNAL', tx + wA + gap, 296);
    ctx.textAlign = 'center';
    font(15, 600);
    ctx.fillStyle = C.muted;
    ctx.fillText('VESPER STATION · SIX SOULS · NO LIFE SIGNS', W / 2, 350);
    font(16, 600);
    ctx.fillStyle = 'rgba(234,242,255,.9)';
    ctx.fillText('A voice says six people are trapped inside. Your instruments disagree.', W / 2, 392);
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * p;
    font(22, 700);
    ctx.fillStyle = C.text;
    ctx.fillText(coarsePointer ? 'TAP TO ANSWER' : 'CLICK TO ANSWER', W / 2, 466);
    ctx.restore();
    font(11, 700);
    ctx.fillStyle = game.muted ? C.danger : 'rgba(139,155,181,.6)';
    ctx.fillText(game.muted ? 'MUTED — PRESS M' : 'AUDIO ON — PRESS M', W / 2, 512);

  } else if (game.state === STATE.PAUSED) {
    dim(0.68);
    font(46, 800);
    ctx.fillStyle = C.text;
    ctx.fillText('PAUSED', W / 2, 318);
    font(14, 600);
    ctx.fillStyle = C.muted;
    ctx.fillText(ROOMS[game.room].title + ' · ' + objectiveLine(), W / 2, 362);
    drawButton(BTN.resume, C.over);
    drawButton(BTN.pauseEnd, C.under);
    font(12, 600);
    ctx.fillStyle = 'rgba(139,155,181,.7)';
    ctx.fillText('P OR ESC RESUMES  ·  M TOGGLES AUDIO', W / 2, 512);

  } else if (game.state === STATE.TRANSITION) {
    const k = game.transTimer / TRANSITION_TIME;
    const fade = k < 0.5 ? k * 2 : (1 - k) * 2;
    dim(Math.min(0.92, fade));
    if (k > 0.3 && k < 0.85) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, fade * 1.6);
      const room = ROOMS[game.room];
      font(12, 700);
      ctx.fillStyle = C.muted;
      ctx.fillText('ACT ' + ACTS[room.act], W / 2, 322);
      font(38, 800);
      ctx.fillStyle = C.text;
      ctx.fillText(String(game.room + 1).padStart(2, '0') + ' — ' + room.title, W / 2, 362);
      ctx.restore();
    }

  } else if (game.state === STATE.DEFEAT) {
    dim(Math.min(0.74, game.endTimer * 1.4));
    if (game.endTimer < 0.25) return;
    font(42, 800);
    ctx.fillStyle = C.danger;
    ctx.fillText('SIGNAL INTERRUPTED', W / 2, 288);
    font(15, 600);
    ctx.fillStyle = C.muted;
    ctx.fillText(String(game.room + 1).padStart(2, '0') + '/' + String(ROOMS.length).padStart(2, '0') + ' — ' + ROOMS[game.room].title, W / 2, 330);
    font(13, 600);
    ctx.fillStyle = 'rgba(139,155,181,.75)';
    ctx.fillText('Completed rooms are kept. Only this room restarts.', W / 2, 360);
    if (game.endTimer > 0.5) {
      drawButton(BTN.retry, C.over);
      drawButton(BTN.restart, 'rgba(255,88,214,.55)', true);
      font(11, 600);
      ctx.fillStyle = 'rgba(139,155,181,.7)';
      ctx.fillText('ENTER — RETRY ROOM   ·   R — RESTART MISSION', W / 2, 548);
    }

  } else if (game.state === STATE.VICTORY) {
    dim(Math.min(0.72, game.endTimer * 0.5));
    if (game.endTimer < 0.5) return;
    font(42, 800);
    ctx.fillStyle = C.over;
    ctx.fillText('SIGNAL RECEIVED', W / 2, 264);
    font(19, 700);
    ctx.fillStyle = C.good;
    ctx.fillText('6 CREW RESCUED. 1 PILOT RETURNED.', W / 2, 306);
    const rows = [['SCORE', String(totalScore())], ['TIME', fmtTime(game.runTime)],
                  ['RETRIES', String(game.retries)]];
    const colW = 210, x0 = W / 2 - (rows.length * colW) / 2;
    rows.forEach((r, i) => {
      const cx = x0 + colW * i + colW / 2;
      font(11, 700); ctx.fillStyle = C.muted;
      ctx.fillText(r[0], cx, 370);
      font(30, 700); ctx.fillStyle = C.text;
      ctx.fillText(r[1], cx, 400);
    });
    if (game.endTimer > 3) {
      ctx.save();
      ctx.globalAlpha = 0.75 + 0.25 * Math.sin(game.frameTime * 3);
      drawButton(BTN.again, C.over);
      ctx.restore();
    }
  }
}

/* ---------- Frame ---------- */
function render(alpha) {
  ctx.save();
  if (game.shake > 0.05 && !reduceMotion) {
    game.shakeX = rnd(-1, 1) * game.shake;
    game.shakeY = rnd(-1, 1) * game.shake;
  } else { game.shakeX = 0; game.shakeY = 0; }
  ctx.translate(game.shakeX, game.shakeY);

  renderBackground();
  renderNarrative();
  renderPlatforms();
  if (game.state !== STATE.TITLE) { renderExit(); renderObjects(); }
  renderRings();
  renderEnemies(alpha);
  renderBullets(alpha);
  if (game.state !== STATE.DEFEAT || game.endTimer < 0.6) renderPlayer(alpha);
  if (game.state === STATE.VICTORY) renderVictoryWorld();
  renderParticles();
  renderFloaters();
  if (game.state === STATE.PLAYING) renderPrompts();
  ctx.restore();

  renderEffects();
  if (game.state !== STATE.TITLE) renderHUD();
  renderOverlay();
}

let lastTime = 0, acc = 0;
function resetClock() { lastTime = (typeof performance !== 'undefined' ? performance.now() : Date.now()); acc = 0; }

function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  game.frameTime += real;

  if (game.state === STATE.PLAYING) {
    acc += real;
    let steps = 0;
    while (acc >= FIXED && steps < 6) {
      update(FIXED);
      acc -= FIXED; steps++;
      if (game.state !== STATE.PLAYING) { acc = 0; break; }
    }
    if (steps >= 6) acc = 0;
  } else if (game.state === STATE.TRANSITION) {
    acc = 0;
    game.transTimer += real;
    if (!game.transLoaded && game.transTimer >= TRANSITION_TIME / 2) {
      game.transLoaded = true;
      loadRoom(game.transTo);
    }
    if (game.transTimer >= TRANSITION_TIME) {
      game.transLoaded = false;
      setState(STATE.PLAYING);
    }
    updateEffects(real);
  } else {
    acc = 0;
    game.endTimer += real;
    if (game.state !== STATE.PAUSED) {
      game.shake = Math.max(0, game.shake - real * 24);
      game.flash = Math.max(0, game.flash - real * 3);
      game.vignette = Math.max(0, game.vignette - real * 1.5);
      game.captionTimer = Math.max(0, game.captionTimer - real);
      updateEffects(real);
    }
  }
  render(game.state === STATE.PLAYING ? acc / FIXED : 1);
}

function resize() {
  const availW = shell.clientWidth || window.innerWidth;
  const availH = shell.clientHeight || window.innerHeight;
  const scale = Math.min(availW / W, availH / H);
  const cssW = Math.max(160, Math.floor(W * scale));
  const cssH = Math.max(90, Math.floor(H * scale));
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  ctx.setTransform(bw / W, 0, 0, bh / H, 0, 0);
  ctx.lineJoin = 'round';
}

function init() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  loadRoom(0);
  game.captionTimer = 0;
  game.state = STATE.TITLE;
  resetClock();
  requestAnimationFrame(frame);
  canvas.focus();
}

init();
})();
</script>
</body>
</html>
